# Non-executable reference of the production deployment workflow.
# Preserved for technical review; GitHub Actions does not load workflows here.
# Production releases are managed separately. This snapshot's Wrangler values
# are sanitized and do not configure the original production target.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate deployment intent
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "[deploy-preflight] INVALID_EVENT"
            exit 1
          fi
          if [ "$DEPLOY_CONFIRMATION" != "DEPLOY" ]; then
            echo "[deploy-preflight] CONFIRMATION_REQUIRED"
            exit 1
          fi
          if [ "$DEPLOY_REF" != "refs/heads/main" ]; then
            echo "[deploy-preflight] MAIN_REQUIRED"
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD 2>/dev/null)" || {
            echo "[deploy-preflight] SHA_MISMATCH"
            exit 1
          }
          if [ "$CHECKED_OUT_SHA" != "$DEPLOY_SHA" ]; then
            echo "[deploy-preflight] SHA_MISMATCH"
            exit 1
          fi

      - name: Validate current main
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          API_RESPONSE_FILE="$(mktemp)" || {
            echo "[deploy-preflight] MAIN_LOOKUP_FAILED"
            exit 1
          }
          trap 'rm -f "$API_RESPONSE_FILE"' EXIT
          if ! curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$API_RESPONSE_FILE" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main"; then
            echo "[deploy-preflight] MAIN_LOOKUP_FAILED"
            exit 1
          fi
          CURRENT_MAIN_SHA="$(node -e 'const fs = require("node:fs"); try { const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const sha = payload?.object?.sha; if (typeof sha !== "string" || !/^[0-9a-f]{40}$/.test(sha)) process.exit(1); process.stdout.write(sha); } catch { process.exit(1); }' "$API_RESPONSE_FILE")" || {
            echo "[deploy-preflight] MAIN_LOOKUP_FAILED"
            exit 1
          }
          if [ "$CURRENT_MAIN_SHA" != "$EXPECTED_SHA" ]; then
            echo "[deploy-preflight] MAIN_MOVED"
            exit 1
          fi

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Test CI helpers and policy
        run: node --test ".github/**/*.test.mjs"

      - name: Run backend tests
        env:
          PENDING_SECRET: ci-only-pending-secret-do-not-use-in-production
        run: node --test "backend/**/*.test.js"

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Build frontend
        env:
          VITE_CAPTCHA_ENABLED: "true"
          VITE_CAPTCHA_PROVIDER: "turnstile"
          VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
        run: npm --prefix frontend run build

      - name: Verify frontend build
        run: node .github/scripts/verify-build.mjs

  deploy:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://dr-vips.com

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate approved main SHA
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD 2>/dev/null)" || {
            echo "[deploy] CHECKED_OUT_SHA_MISMATCH_AFTER_APPROVAL"
            exit 1
          }
          if [ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]; then
            echo "[deploy] CHECKED_OUT_SHA_MISMATCH_AFTER_APPROVAL"
            exit 1
          fi
          API_RESPONSE_FILE="$(mktemp)" || {
            echo "[deploy] MAIN_LOOKUP_FAILED_AFTER_APPROVAL"
            exit 1
          }
          trap 'rm -f "$API_RESPONSE_FILE"' EXIT
          if ! curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$API_RESPONSE_FILE" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main"; then
            echo "[deploy] MAIN_LOOKUP_FAILED_AFTER_APPROVAL"
            exit 1
          fi
          CURRENT_MAIN_SHA="$(node -e 'const fs = require("node:fs"); try { const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const sha = payload?.object?.sha; if (typeof sha !== "string" || !/^[0-9a-f]{40}$/.test(sha)) process.exit(1); process.stdout.write(sha); } catch { process.exit(1); }' "$API_RESPONSE_FILE")" || {
            echo "[deploy] MAIN_LOOKUP_FAILED_AFTER_APPROVAL"
            exit 1
          }
          if [ "$CURRENT_MAIN_SHA" != "$EXPECTED_SHA" ]; then
            echo "[deploy] MAIN_MOVED_AFTER_APPROVAL"
            exit 1
          fi

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        env:
          VITE_CAPTCHA_ENABLED: "true"
          VITE_CAPTCHA_PROVIDER: "turnstile"
          VITE_TURNSTILE_SITE_KEY: ${{ vars['VITE_TURNSTILE_SITE_KEY'] }}
        run: |
          if [ -z "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "[deploy] VITE_TURNSTILE_SITE_KEY_MISSING"
            exit 1
          fi
          npm --prefix frontend run build

      - name: Verify frontend build
        run: node .github/scripts/verify-build.mjs

      - name: Check Docker availability
        run: docker version

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy

      - name: Run production smoke tests
        run: node .github/scripts/production-smoke.mjs
