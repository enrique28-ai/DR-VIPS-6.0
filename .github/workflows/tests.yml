name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check whitespace errors
        run: git diff --check

      - name: Test CI helpers
        run: node --test ".github/**/*.test.mjs"

      - name: Install backend dependencies
        run: npm ci

      - name: Check critical entrypoint syntax
        run: |
          node --check backend/src/server.js
          node --check backend/src/config/db.js
          node --check backend/src/runtime/startup.js
          node --check backend/src/runtime/gracefulShutdown.js
          node --check cloudflare/src/index.js

      - name: Run backend tests
        run: node --test "backend/**/*.test.js"

  frontend-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Verify frontend build
        run: node .github/scripts/verify-build.mjs
