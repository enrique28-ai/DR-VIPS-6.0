name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate deployment intent
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "[deploy-preflight] INVALID_EVENT"
            exit 1
          fi
          if [ "$DEPLOY_CONFIRMATION" != "DEPLOY" ]; then
            echo "[deploy-preflight] CONFIRMATION_REQUIRED"
            exit 1
          fi
          if [ "$DEPLOY_REF" != "refs/heads/main" ]; then
            echo "[deploy-preflight] MAIN_REQUIRED"
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD 2>/dev/null)" || {
            echo "[deploy-preflight] SHA_MISMATCH"
            exit 1
          }
          if [ "$CHECKED_OUT_SHA" != "$DEPLOY_SHA" ]; then
            echo "[deploy-preflight] SHA_MISMATCH"
            exit 1
          fi

      - name: Validate current main
        run: |
          if ! git fetch --no-tags origin main >/dev/null 2>&1; then
            echo "[deploy-preflight] MAIN_MOVED"
            exit 1
          fi
          CURRENT_MAIN_SHA="$(git rev-parse origin/main 2>/dev/null)" || {
            echo "[deploy-preflight] MAIN_MOVED"
            exit 1
          }
          if [ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "[deploy-preflight] MAIN_MOVED"
            exit 1
          fi

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Test CI helpers and policy
        run: node --test ".github/**/*.test.mjs"

      - name: Run backend tests
        run: node --test "backend/**/*.test.js"

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Build frontend
        env:
          VITE_CAPTCHA_ENABLED: "true"
          VITE_CAPTCHA_PROVIDER: "turnstile"
          VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
        run: npm --prefix frontend run build

      - name: Verify frontend build
        run: node .github/scripts/verify-build.mjs

  deploy:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://dr-vips.com

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate approved main SHA
        run: |
          if ! git fetch --no-tags origin main >/dev/null 2>&1; then
            echo "[deploy] MAIN_MOVED_AFTER_APPROVAL"
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD 2>/dev/null)" || {
            echo "[deploy] MAIN_MOVED_AFTER_APPROVAL"
            exit 1
          }
          CURRENT_MAIN_SHA="$(git rev-parse origin/main 2>/dev/null)" || {
            echo "[deploy] MAIN_MOVED_AFTER_APPROVAL"
            exit 1
          }
          if [ "$CHECKED_OUT_SHA" != "$GITHUB_SHA" ] || [ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "[deploy] MAIN_MOVED_AFTER_APPROVAL"
            exit 1
          fi

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        env:
          VITE_CAPTCHA_ENABLED: "true"
          VITE_CAPTCHA_PROVIDER: "turnstile"
          VITE_TURNSTILE_SITE_KEY: ${{ vars['VITE_TURNSTILE_SITE_KEY'] }}
        run: |
          if [ -z "$VITE_TURNSTILE_SITE_KEY" ]; then
            echo "[deploy] VITE_TURNSTILE_SITE_KEY_MISSING"
            exit 1
          fi
          npm --prefix frontend run build

      - name: Verify frontend build
        run: node .github/scripts/verify-build.mjs

      - name: Check Docker availability
        run: docker version

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy

      - name: Run production smoke tests
        run: node .github/scripts/production-smoke.mjs
